    function sendToWebhook(logEntry, stage = 'end') {
        const shiftStart = getShiftStartTime();
        const payload = {
            stage: stage,
            door: logEntry.door,
            id: logEntry.id,
            account: logEntry.account,
            type: logEntry.type,
            unloader: logEntry.unloader,
            assistants: logEntry.assistants || [],
            start: logEntry.start,
            end: logEntry.end,
            dateKey: logEntry.dateKey,
            durationMinutes: logEntry.durationMinutes,
            cpuOptions: logEntry.cpuOptions,
            duplicate: logEntry.duplicate,
            manual: logEntry.manual,
            completionHour: logEntry.completionHour,
            status: logEntry.status,
            moveDest: logEntry.moveDest,
            shiftStart: shiftStart,
            logId: logEntry.logId,
            dwellTimeMinutes: logEntry.dwellTime || null,
            idleBeforeStartMinutes: logEntry.idleBeforeStart || null,
            laborStart: logEntry.laborStart || null,
            laborDurationMinutes: logEntry.laborDuration || null
        };
        attemptWebhook(payload);
    }
    
    function attemptWebhook(payload) {
        if (!navigator.onLine) {
            queuePayload(payload);
            return;
        }
        fetch(WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
        }).catch(err => {
            console.error('Webhook error, queuing:', err);
            queuePayload(payload);
        });
    }
    
    function queuePayload(payload) {
        let queue = JSON.parse(localStorage.getItem('ps9_webhook_queue') || '[]');
        queue.push(payload);
        localStorage.setItem('ps9_webhook_queue', JSON.stringify(queue));
    }
    
    let isSyncingWebhook = false;
    
    function processWebhookQueue() {
        if (isSyncingWebhook || !navigator.onLine) return;
        let queue = JSON.parse(localStorage.getItem('ps9_webhook_queue') || '[]');
        if (queue.length === 0) return;
        isSyncingWebhook = true;
        const payload = queue[0];
        fetch(WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            let cq = JSON.parse(localStorage.getItem('ps9_webhook_queue') || '[]');
            cq.shift();
            localStorage.setItem('ps9_webhook_queue', JSON.stringify(cq));
            isSyncingWebhook = false;
            if (cq.length > 0) processWebhookQueue();
        }).catch(err => {
            isSyncingWebhook = false;
        });
    }
    
    function openPPHCalculator() {
        byId('pph-volume').value = '';
        byId('pph-hours').value = '';

        byId('pph-diff').innerText = '0.00 hrs';

    function calculatePPH() {
        const vol = parseFloat(byId('pph-volume').value), hrs = parseFloat(byId('pph-hours').value), resEl = byId('pph-result'), diffEl = byId('pph-diff');
        if (isNaN(vol) || isNaN(hrs) || hrs <= 0) {
            resEl.innerText = '0';
            diffEl.innerText = '0.00 hrs';
            diffEl.style.background = '#e5e5ea';
            diffEl.style.color = '#000';
            return;
        }
        const pph = Math.round(vol / hrs);
        resEl.innerText = pph;
        const targetHours = vol / 600, diff = hrs - targetHours;
        let diffText = diff > 0 ? '+' + diff.toFixed(2) : diff.toFixed(2);
        diffEl.innerText = diffText + ' hrs';
        if (diff <= 0) {
            diffEl.style.background = '#e8f5e9';
            diffEl.style.color = '#2e7d32';
        } else {
            diffEl.style.background = '#ffebee';
            diffEl.style.color = '#c62828';
        }
    }
    
    function uploadPPH() {
        const vol = parseFloat(byId('pph-volume').value), hrs = parseFloat(byId('pph-hours').value);
        if (isNaN(vol) || isNaN(hrs) || hrs <= 0) return alert("Please enter valid volume and hours first.");
        const pph = Math.round(vol / hrs), diff = (hrs - vol / 600).toFixed(2);
        attemptWebhook({ dataType: 'PPH_UPLOAD', dateKey: dateKeyFromTs(Date.now()), shiftStart: getShiftStartTime(), volume: vol, hours: hrs, pph: pph, diffHours: diff });
        const btn = byId('pph-push-btn'), origText = btn.innerText;

    function renderNotesList() {
        const search = byId('notes-search').value.toLowerCase(), container = byId('notes-list-container');
        container.innerHTML = '';
        const entries = Object.entries(wallyNotes).filter(([id, note]) => !search || id.toLowerCase().includes(search) || note.toLowerCase().includes(search)).sort((a, b) => a[0].localeCompare(b[0]));
        if (entries.length === 0) {

        entries.forEach(([id, note]) => {

    function backupData(mode) {

        else {

        data['ps9_wally_notes'] = JSON.stringify(wallyNotes);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), a = document.createElement('a');

        a.download = `wally-${mode}-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        showSaveToast();

    function triggerRestore() { byId('restore-file-input').click(); }
    
    function restoreData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const data = JSON.parse(e.target.result);
                if (!data || Object.keys(data).length === 0) throw new Error("Empty file");
                if (confirm("Overwrite current data with backup?")) {
                    Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));
                    alert("Data restored!");
                    location.reload();
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

    function setupAttributionSlider() {
        const track = document.querySelector('.slider-track'), thumb = byId('slider-thumb');
        if (!track || !thumb) return;
        let isDragging = false, saveTimer = null;
        
        function updateSlider(clientX, persist) {
            const rect = track.getBoundingClientRect();
            let pct = ((clientX - rect.left) / rect.width) * 100;
            pct = Math.max(0, Math.min(100, pct));
            const snapPoints = [0, 50, 100];
            let closest = snapPoints.reduce((prev, curr) => (Math.abs(curr - pct) < Math.abs(prev - pct) ? curr : prev));
            pct = closest;
            const startMin = Math.round((pct / 100) * 10);
            if (startMin === attributionConfig.minutes) return;
            attributionConfig.minutes = startMin;
            updateAttributionUI();
            if (persist) saveAttributionSetting();
            else {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveAttributionSetting, 200);
            }
        }
        
        thumb.addEventListener('touchstart', (e) => {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            updateSlider(e.touches[0].clientX, false);
        }, { passive: false });
        
        document.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            saveAttributionSetting();
        });
        
        thumb.addEventListener('mousedown', (e) => {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            updateSlider(e.clientX, false);
        });
        
        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            saveAttributionSetting();
        });
        
        track.addEventListener('click', (e) => updateSlider(e.clientX, true));
    }
    
    function updateTabBadges() {
        let activeCount = 0;
        for (let i = DOORS_START; i <= DOORS_END; i++) if (doors[i] && doors[i].status === 'active') activeCount++;
        const badge = byId('badge-active');
        if (badge) {
            if (activeCount === 0) badge.style.display = 'none';
            else {
                badge.textContent = activeCount > 99 ? '99+' : activeCount.toString();
                badge.style.display = 'flex';
                if (activeCount >= 6) {
                    badge.classList.add('warning');
                    badge.classList.remove('success', 'zero');
                } else if (activeCount >= 3) {
                    badge.classList.add('success');
                    badge.classList.remove('warning', 'zero');
                } else badge.classList.remove('warning', 'success', 'zero');
            }
        }
    }
