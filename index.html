<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bay Test</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #fff; }
        h2 { text-align: center; }
        .bays-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin: 20px 0; min-height: 60px; }
        .bay-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #000; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .bay-9 { background-color: #4cd964; }
        .bay-10 { background-color: #bf5af2; }
        .bay-11 { background-color: #ff9500; }
        .bay-12 { background-color: #bf5af2; }
        .bay-13 { background-color: #ff9500; }
        .bay-14 { background-color: #ff9500; }
        .bay-15 { background-color: #ff9500; }
        .bay-16 { background-color: #ff9500; }
        #debug { padding: 10px; font-family: monospace; font-size: 14px; background: #f5f5f5; border-radius: 8px; margin: 20px 0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Wally Bay Test v1</h2>
    <p style="text-align:center;color:#999;">If you see 8 colored circles below, JS works.</p>

```
<h3 style="text-align:center;">Open Bays</h3>
<div id="bays" class="bays-grid"></div>

<div id="debug">Loading...</div>

<h3 style="text-align:center;">Test Buttons</h3>
<button onclick="document.getElementById('debug').textContent='Button clicked at '+new Date().toLocaleTimeString()" style="display:block;margin:10px auto;padding:15px 30px;font-size:16px;border-radius:12px;border:2px solid #000;background:#fff;">Test Click</button>

<button onclick="localStorage.clear();location.reload();" style="display:block;margin:10px auto;padding:15px 30px;font-size:16px;border-radius:12px;border:none;background:#ff3b30;color:#fff;">Reset All Data & Reload</button>
```

<script>
var dbg = document.getElementById('debug');
var grid = document.getElementById('bays');
var log = '';

try {
    log += 'JS executing at ' + new Date().toLocaleTimeString() + '\n';
    log += 'User agent: ' + navigator.userAgent.substring(0, 80) + '\n';
    
    for (var i = 9; i <= 16; i++) {
        var btn = document.createElement('div');
        btn.className = 'bay-circle bay-' + i;
        btn.textContent = i;
        btn.onclick = (function(num) {
            return function() { 
                dbg.textContent = 'Tapped bay ' + num + ' at ' + new Date().toLocaleTimeString(); 
            };
        })(i);
        grid.appendChild(btn);
        log += 'Created bay ' + i + '\n';
    }
    
    log += 'Total children in grid: ' + grid.children.length + '\n';
    log += 'Grid innerHTML length: ' + grid.innerHTML.length + '\n';
    log += 'SUCCESS - all 8 bays created\n';
    
    // Also test localStorage
    try {
        localStorage.setItem('_test', '1');
        localStorage.removeItem('_test');
        log += 'localStorage: OK\n';
    } catch(e) {
        log += 'localStorage: BLOCKED - ' + e.message + '\n';
    }

} catch(e) {
    log += 'ERROR: ' + e.message + '\n' + e.stack + '\n';
}

dbg.textContent = log;
</script>

</body>
</html>
